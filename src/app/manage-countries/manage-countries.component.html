<div class="manage-countries-container">
    <div class="teal-header-container">
        <nav class="admin-nav" aria-label="Admin pages">
            <a routerLink="/admin" class="admin-nav-link active" aria-current="page">Countries</a>
            <a routerLink="/admin/users" class="admin-nav-link">Users</a>
        </nav>
        <div class="header-controls">
            <ng-container *ngIf="currentUser$ | async as user">
                <span class="welcome-text">Welcome, {{ user.displayName }}!</span>
                <button mat-raised-button color="primary" (click)="goHome()">Home</button>
                <button mat-raised-button (click)="logout()">Logout</button>
            </ng-container>
        </div>
    </div>

    <div class="lists-container">
        <div class="list-column">
            <h2>Unused Countries</h2>
            <input #filterInput type="text" class="country-filter" placeholder="Filter countries... (Enter adds the top match)"
                autocomplete="off" [value]="unusedFilter"
                (input)="onFilterInput(filterInput.value)"
                (keydown.enter)="addTopMatch()"
                (keydown.escape)="onFilterInput('')" />
            <div class="scrollable-list">
                <div *ngIf="unusedFilter.trim() && filteredUnusedCountries.length === 0" class="filter-empty">
                    No unused country matches "{{ unusedFilter }}"
                </div>
                <div *ngFor="let country of filteredUnusedCountries" class="list-item"
                    style="display: flex; justify-content: space-between; align-items: center;">
                    <span>{{ country }}</span>
                    <button mat-icon-button color="primary" (click)="moveToNewlyUsed(country)"
                        [disabled]="movedCountries.has(country)">
                        <mat-icon>arrow_forward</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <div class="list-column">
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px;">
                <h2 style="border: none; padding: 0; margin: 0;">Newly Used Countries</h2>
                <button mat-raised-button color="primary" (click)="commitCountries()"
                    [disabled]="newlyUsedCountries.length === 0">Commit</button>
            </div>
            <div class="scrollable-list">
                <div *ngFor="let country of newlyUsedCountries" class="list-item"
                    style="display: flex; justify-content: space-between; align-items: center;">
                    <button mat-icon-button color="warn" (click)="removeFromNewlyUsed(country)">
                        <mat-icon>arrow_back</mat-icon>
                    </button>
                    <span>{{ country }}</span>
                </div>
            </div>
        </div>

        <div class="list-column">
            <h2>Used Countries</h2>
            <div class="scrollable-list">
                <div *ngFor="let country of usedCountries" class="list-item">
                    {{ country }}
                </div>
            </div>
        </div>
    </div>
</div>
