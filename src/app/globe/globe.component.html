<div class="globe-page">
    <div #globeViz class="globe-viz"></div>

    <div class="admin-menu" *ngIf="isAdmin$ | async">
        <button mat-icon-button [matMenuTriggerFor]="adminMenu" color="warn" aria-label="Admin Menu">
            <mat-icon>admin_panel_settings</mat-icon>
        </button>
        <mat-menu #adminMenu="matMenu">
            <button mat-menu-item (click)="debugCountries()">
                <mat-icon>bug_report</mat-icon>
                <span>Debug Countries</span>
            </button>
            <button mat-menu-item (click)="testSummary()">
                <mat-icon>play_circle_filled</mat-icon>
                <span>Test Summary</span>
            </button>
            <button mat-menu-item (click)="runModelDiagnostic()">
                <mat-icon>info</mat-icon>
                <span>Model Diagnostic</span>
            </button>
        </mat-menu>
    </div>

    <!-- Desktop: the panels below sit left (summary), right (picks) and bottom center (button + result).
         Phones: they stack at the bottom; summary and picks minimize to chips above the result. -->
    <div class="bottom-stack">

        <!-- Year summary -->
        <div *ngIf="history.length === 12" class="summary-panel" [class.minimized]="summaryMinimized">
            <button type="button" class="panel-chip" (click)="toggleSummary()"
                [attr.aria-expanded]="!summaryMinimized" aria-controls="summary-body">
                <mat-icon class="chip-icon">auto_awesome</mat-icon>
                <span class="chip-label">Breakdown</span>
                <mat-icon class="chip-chevron">{{ summaryMinimized ? 'expand_less' : 'expand_more' }}</mat-icon>
            </button>
            <div id="summary-body" class="summary-body">
                <h2 class="summary-title">Your {{nextYear}} Cultural Dinner Breakdown!</h2>

                <div *ngIf="isGeneratingSummary" class="summary-loading">
                    <p>Consulting the Oracle...</p>
                </div>

                <div *ngIf="!isGeneratingSummary && summaryText" class="summary-text">
                    <markdown [data]="summaryText"></markdown>
                </div>
            </div>
        </div>

        <!-- This year's picks -->
        <div class="history-panel" [class.open]="historyOpen">
            <button type="button" class="panel-chip history-toggle" (click)="toggleHistory()"
                [attr.aria-expanded]="historyOpen" aria-controls="history-list">
                <mat-icon class="chip-icon">public</mat-icon>
                <span class="history-title"><span class="chip-year">{{ nextYear }}'s </span>Countries</span>
                <span class="history-count">{{ history.length }}/12</span>
                <mat-icon class="chip-chevron">{{ historyOpen ? 'expand_more' : 'expand_less' }}</mat-icon>
            </button>
            <div id="history-list" class="history-list">
                <div *ngFor="let country of history; let i = index" (click)="onHistoryItemClick(country)" class="history-item">
                    {{ i + 1 }}. {{ country }}
                </div>
                <div *ngIf="history.length === 0" class="history-empty">
                    No countries selected yet.
                </div>
            </div>
            <button mat-raised-button color="accent" class="copy-btn" (click)="copyHistoryToClipboard()" *ngIf="history.length >= 12">
                Copy to Clipboard
            </button>
        </div>

        <!-- Choose button and result (on phones the result sits above the button) -->
        <div class="spin-dock">
            <button mat-raised-button color="primary" class="spin-btn"
                (click)="spinToRandomCountry()" [disabled]="isSpinning" *ngIf="history.length < 12">
                {{ isSpinning ? 'Choosing...' : 'Choose Next Country!' }}
            </button>
            <div *ngIf="selectedCountry && !isSpinning" class="spin-result" aria-live="polite">
                {{ selectedCountry }}
            </div>
        </div>
    </div>
</div>
