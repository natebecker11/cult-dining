<div *ngIf="showGlobalHeader$ | async" class="global-header">
  <ng-container *ngIf="currentUser$ | async as user; else loginBtn">
    <span class="welcome">Welcome, {{ user.displayName }}!</span>
    <button mat-raised-button color="primary" (click)="openLookup()" title="Look up country (/)" aria-label="Look up country">
      <mat-icon>search</mat-icon><span class="lookup-label">Look up country</span>
    </button>
    <button mat-raised-button color="warn" *ngIf="isAdmin$ | async" (click)="goToAdmin()">Manage Countries</button>

    <ng-container *ngIf="isWheelPage$ | async; else wheelBtn">
      <button mat-raised-button color="accent" routerLink="/">Globe View</button>
    </ng-container>
    <ng-template #wheelBtn>
      <button mat-raised-button color="accent" routerLink="/wheel">Wheel View</button>
    </ng-template>

    <button mat-raised-button (click)="logout()">Logout</button>
  </ng-container>
  <ng-template #loginBtn>
    <button mat-raised-button color="primary" (click)="openLookup()" title="Look up country (/)" aria-label="Look up country">
      <mat-icon>search</mat-icon><span class="lookup-label">Look up country</span>
    </button>
    <button mat-raised-button color="primary" (click)="login()">Login with Google</button>

    <ng-container *ngIf="isWheelPage$ | async; else wheelBtnLogin">
      <button mat-raised-button color="accent" routerLink="/">Globe View</button>
    </ng-container>
    <ng-template #wheelBtnLogin>
      <button mat-raised-button color="accent" routerLink="/wheel">Wheel View</button>
    </ng-template>
  </ng-template>
</div>
<router-outlet></router-outlet>
