<div *ngIf="showGlobalHeader$ | async"
  style="position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 10px; align-items: center;">
  <ng-container *ngIf="currentUser$ | async as user; else loginBtn">
    <span style="font-weight: 500; margin-right: 10px;">Welcome, {{ user.displayName }}!</span>
    <button mat-raised-button color="warn" *ngIf="isAdmin$ | async" (click)="goToAdmin()">Manage Countries</button>

    <ng-container *ngIf="isGlobePage$ | async; else globeBtn">
      <button mat-raised-button color="primary" routerLink="/">Home</button>
    </ng-container>
    <ng-template #globeBtn>
      <button mat-raised-button color="accent" routerLink="/globe">Globe View</button>
    </ng-template>

    <button mat-raised-button (click)="logout()">Logout</button>
  </ng-container>
  <ng-template #loginBtn>
    <button mat-raised-button color="primary" (click)="login()">Login with Google</button>

    <ng-container *ngIf="isGlobePage$ | async; else globeBtnLogin">
      <button mat-raised-button color="primary" routerLink="/">Home</button>
    </ng-container>
    <ng-template #globeBtnLogin>
      <button mat-raised-button color="accent" routerLink="/globe">Globe View</button>
    </ng-template>
  </ng-template>
</div>
<router-outlet></router-outlet>
